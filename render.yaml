# Blueprint do Render — só o backend.
#
# O painel (Next.js) vai para a Vercel e o Postgres para a Neon; aqui fica a
# API. Ver DEPLOY.md para o passo a passo e para o porquê dessa divisão.
#
# Como usar: no Render, New → Blueprint, aponte para este repositório. Ele lê
# este arquivo e cria o serviço. As variáveis marcadas `sync: false` ele
# pergunta na hora — são as que não podem viver no git.

services:
  - type: web
    name: bet-board-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health

    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: LOG_LEVEL
        value: INFO

      # A string de conexão da Neon, com `?sslmode=require`. Pode colar como a
      # Neon entrega (`postgresql://…`): o backend troca o driver sozinho.
      - key: DATABASE_URL
        sync: false

      # Domínio do painel na Vercel. Aceita lista por vírgula:
      #   https://bet-board.vercel.app,https://painel.seudominio.com
      - key: CORS_ORIGINS
        sync: false

      # Assina o token da sessão. `generateValue` cria uma aleatória no primeiro
      # deploy e a mantém entre deploys — trocá-la desloga todo mundo.
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: AUTH_TOKEN_TTL_MINUTES
        value: 720
      # Inatividade que derruba a sessão. O painel renova o token enquanto a
      # pessoa usa a tela; parou, ele expira no servidor — não é o navegador
      # que decide.
      - key: AUTH_IDLE_TIMEOUT_MINUTES
        value: 10

      # Primeiro administrador. Cria (ou promove) esta conta no start, uma vez.
      # Depois disso as contas nascem em /admin, no painel.
      - key: SUPERUSER_USERNAME
        sync: false
      - key: SUPERUSER_PASSWORD
        sync: false

      # IA de visão que lê o print da tip.
      #
      # Provedor e modelo são `sync: false` de propósito. Com um valor fixo
      # aqui, trocar o provedor pelo painel do Render funcionaria até a próxima
      # sincronização do blueprint, que silenciosamente devolveria o antigo —
      # e a tip voltaria a ser lida pelo modelo errado sem ninguém mexer em nada.
      #
      #   gemini    -> VISION_MODEL=models/gemini-3.5-flash-lite
      #   anthropic -> VISION_MODEL=claude-haiku-4-5-20251001
      - key: VISION_PROVIDER
        sync: false
      - key: VISION_API_KEY
        sync: false
      - key: VISION_MODEL
        sync: false
      # Só o Gemini usa; no Anthropic é ignorado.
      - key: VISION_MEDIA_RESOLUTION
        value: low
      - key: VISION_TIMEOUT_SECONDS
        value: 30
      - key: VISION_MAX_ATTEMPTS
        value: 3
