[project]
name = "bet-board-backend"
version = "0.1.0"
description = "Bet Board — API de administração de grupos de tips esportivas"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "anthropic>=0.116",
    "google-genai>=2.20",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "vision: chama a API de visão de verdade (custa dinheiro; precisa de VISION_API_KEY)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# migrations são geradas pelo Alembic — não vale a pena reformatar à mão
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
